name: Playwright UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Python version
        run: python --version

      - name: Install dependencies and browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start local application
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          python - <<'PYCODE'
          import time, urllib.request
          url = 'http://127.0.0.1:8000/delivery.html'
          for attempt in range(30):
              try:
                  urllib.request.urlopen(url, timeout=1).close()
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Local server did not start')
          PYCODE

      - name: Run UI tests
        run: |
          python -m pytest -v --browser chromium \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output test-results --junitxml=report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            report.xml
            test-results/
            server.log
          if-no-files-found: warn
